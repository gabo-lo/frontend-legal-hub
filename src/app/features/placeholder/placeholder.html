<main
  class="mx-auto flex min-h-[60vh] max-w-[1180px] flex-col items-center justify-center px-5 py-16 text-center sm:px-6"
>
  <span class="flex h-16 w-16 items-center justify-center rounded-full bg-sand/40 text-sand-deep">
    <mat-icon class="placeholder-icon">{{ icon() }}</mat-icon>
  </span>
  <h1 class="mt-6 text-3xl font-bold tracking-tight text-ink sm:text-4xl">{{ title() }}</h1>
  <p class="mt-3 max-w-[460px] text-base leading-relaxed text-muted">
    Esta sección estará disponible próximamente. Mientras tanto, puedes volver al inicio y explorar
    las áreas de estudio.
  </p>
  <a
    routerLink="/"
    class="mt-8 rounded-full bg-sand px-6 py-3 text-sm font-semibold text-ink shadow-sm transition hover:bg-sand-dark hover:text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-sand-deep"
  >
    Volver al inicio
  </a>
</main>

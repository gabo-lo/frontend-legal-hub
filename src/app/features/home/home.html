<main class="mx-auto max-w-[1180px] px-5 pb-12 pt-10 sm:px-6 md:pt-12 lg:pb-5 lg:pt-8">
  <section aria-labelledby="home-title">
    <h1
      id="home-title"
      class="max-w-[20ch] text-4xl font-bold leading-[1.05] tracking-[-0.03em] text-ink sm:text-5xl lg:text-6xl"
    >
      Tu estudio de derecho, ahora en web
    </h1>
    <p class="mt-5 max-w-[560px] text-base leading-relaxed text-muted md:text-lg lg:mt-4">
      Aprende con cuestionarios por tema y listas de 50 preguntas. Elige un área para comenzar.
    </p>
  </section>

  <section class="mt-12 md:mt-14 lg:mt-6" aria-label="Áreas de estudio">
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4 lg:gap-3 xl:gap-4">
      @for (card of cards; track card.id) {
        <app-legal-area-card
          [title]="card.title"
          [icon]="card.icon"
          [subtitle]="card.subtitle"
          [route]="card.route"
          [featured]="card.featured ?? false"
          [badge]="card.badge"
        />
      }
    </div>
  </section>
</main>
